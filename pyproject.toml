[project]
name = "neo-cortex"
version = "0.1.0"
description = "Agent memory + company brain + GraphRAG reasoning on FalkorDB, exposed over MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "falkordblite",
  "falkordb",
  "gliner2",
  "sentence-transformers",
  "torch",
  "torchvision",
  "pillow",
  "bm25s",
  "PyStemmer",
  "mcp>=2.3",
  "numpy",
  "pyyaml",
  "firecrawl-anydoc",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
neo = "neo_cortex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo_cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
